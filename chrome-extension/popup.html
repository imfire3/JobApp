<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobApp Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #6366f1;
      --accent-2: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e293b, var(--bg));
      color: var(--text);
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 5px;
      background: linear-gradient(90deg, var(--accent-2), #c7d2fe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header p {
      font-size: 14px;
      color: var(--muted);
    }

    .server-status {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f87171;
      animation: pulse 2s infinite;
    }

    .status-dot.online {
      background: var(--ok);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: 14px;
      background: var(--panel-2);
      color: var(--text);
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    button {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent-2);
    }

    .btn-secondary:hover {
      background: rgba(99, 102, 241, 0.15);
    }

    .message {
      padding: 10px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #4ade80;
    }

    .message.error {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #f87171;
    }

    .message.show {
      display: block;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .tab.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .settings-group {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    .settings-group h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>JobApp</h1>
      <p>Assistant de gestion d'emplois</p>
    </div>
    
    <div class="server-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Vérification du serveur...</span>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-tab="post">Publier</button>
      <button class="tab" data-tab="extract">Extraire</button>
      <button class="tab" data-tab="settings">Paramètres</button>
    </div>
    
    <div class="tab-content active" id="post-tab">
      <form id="jobForm">
        <div class="form-group">
          <label for="title">Titre du poste</label>
          <input type="text" id="title" required>
        </div>
        
        <div class="form-group">
          <label for="company">Entreprise</label>
          <input type="text" id="company" required>
        </div>
        
        <div class="form-group">
          <label for="location">Localisation</label>
          <input type="text" id="location" required>
        </div>
        
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" required></textarea>
        </div>
        
        <button type="submit" class="btn-primary">Publier l'offre</button>
      </form>
      
      <button id="extractBtn" class="btn-secondary">Extraire depuis la page actuelle</button>
    </div>
    
    <div class="tab-content" id="extract-tab">
      <p style="margin-bottom: 15px; font-size: 14px; color: var(--muted);">
        Cette fonctionnalité extrait automatiquement les informations d'offres d'emploi depuis la page web actuelle.
      </p>
      <button id="extractPageBtn" class="btn-primary">Extraire les infos</button>
      <button id="importWTTJBtn" class="btn-secondary">Importer 10 jobs Welcome to the Jungle</button>
    </div>
    
    <div class="tab-content" id="settings-tab">
      <div class="settings-group">
        <h3>Serveur API</h3>
        <div class="form-group">
          <label for="serverUrl">URL du serveur</label>
          <input type="text" id="serverUrl" value="http://localhost:3000">
        </div>
        <button id="saveSettings" class="btn-primary">Enregistrer</button>
      </div>
      
      <button id="openApp" class="btn-secondary">Ouvrir l'application web</button>
    </div>
    
    <div id="message" class="message"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
